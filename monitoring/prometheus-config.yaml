
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: devsecops-ai
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: "devsecops-ai-api"
        metrics_path: "/metrics"
        static_configs:
          - targets:
              - "devsecops-ai-api-service.devsecops-ai.svc.cluster.local:80"
